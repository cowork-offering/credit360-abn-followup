<!doctype html>
<html lang="en-GB" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f7f6f3">
<title>Accenture · Follow-up materials</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--paper:#f7f6f3;--white:#fff;--ink:#0b0a0d;--ink2:#3d3a44;--muted:#6b6873;--faint:#a3a0aa;--hair:rgba(11,10,13,.1);--brand:#a100ff;--brand-ink:#7500c0;--err:#b3261e;
  --ease:cubic-bezier(.22,.61,.36,1);--sans:'Graphik',"Helvetica Neue",Helvetica,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--sans);-webkit-font-smoothing:antialiased}
html.locked,html.opening{overflow:hidden}
html{scroll-behavior:auto}

#gate{position:fixed;inset:0;z-index:1000;display:flex;background:var(--paper)}
.gpane{position:relative;flex:0 0 46%;overflow:hidden;background:#141019;clip-path:inset(0 0 0 0)}
.gpane .ph{position:absolute;inset:0;background:url(assets/gate.jpg) 58% 50%/cover no-repeat;filter:saturate(.85);transform:scale(1.06);animation:drift 28s var(--ease) forwards}
.gpane::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 50%,rgba(8,0,14,.30),rgba(8,0,14,.06) 70%),linear-gradient(0deg,rgba(8,0,14,.42),rgba(8,0,14,0) 45%)}
@keyframes drift{to{transform:scale(1)}}
.gmark{position:absolute;inset:0;z-index:2;display:grid;place-items:center;filter:drop-shadow(0 2px 20px rgba(8,0,14,.32))}
.gmark>*{grid-area:1/1;width:min(22%,150px)}
.gmark-c{display:block;height:auto;color:var(--brand);animation:settle .9s cubic-bezier(.25,.46,.45,.94) both,breathe 4s ease-in-out .9s infinite}
@keyframes settle{from{filter:blur(6px);transform:scale(1.05);opacity:0}40%{opacity:1}to{filter:blur(0);transform:scale(1);opacity:1}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.86}}
.gcap{position:absolute;left:clamp(24px,4vw,48px);bottom:clamp(22px,4vh,40px);z-index:2;color:rgba(255,255,255,.82);font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;font-family:'Graphik Semibold',var(--sans)}
#gate.striking .gmark-c{animation:strike 70ms linear 1 both}
@keyframes strike{0%,49.99%{color:#fff}50%,100%{color:var(--brand)}}
#gate.leaving .gpane{clip-path:inset(0 100% 0 0);transition:clip-path .9s cubic-bezier(.76,0,.24,1)}
#gate.leaving .gform{opacity:0;transform:translateX(24px);transition:opacity .5s var(--ease),transform .7s var(--ease)}
#gate.gone{opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}

.gform{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:32px clamp(20px,6vw,88px);overflow-y:auto}
.gwrap{width:100%;max-width:500px;display:flex;flex-direction:column;gap:18px}
.glogo{width:112px;color:var(--ink);margin-bottom:clamp(24px,8vh,72px)}
.eyebrow{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--brand-ink);font-family:'Graphik Semibold',var(--sans)}
.gwrap h1{margin:0;font-family:'Graphik Semibold',var(--sans);font-weight:600;font-size:clamp(36px,4.4vw,54px);line-height:1.02;letter-spacing:-.034em;text-wrap:balance}
.gwrap p{margin:0;font-family:'Graphik Light',var(--sans);font-size:18px;line-height:1.5;color:var(--ink2);max-width:40ch}
form{display:flex;margin-top:12px;background:var(--white);border:1px solid var(--hair);border-radius:999px;padding:6px;box-shadow:0 1px 2px rgba(11,10,13,.04),0 14px 34px -20px rgba(11,10,13,.22);transition:border-color .2s,box-shadow .2s}
form:focus-within{border-color:rgba(117,0,192,.4);box-shadow:0 0 0 4px rgba(161,0,255,.07),0 14px 34px -20px rgba(11,10,13,.22)}
form.shake{animation:nudge .26s linear 1}
@keyframes nudge{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;font-size:17px;letter-spacing:.08em;padding:12px 18px;outline:none}
input::placeholder{color:var(--faint);letter-spacing:.01em}
#go{font:inherit;font-family:'Graphik Semibold',var(--sans);font-size:15px;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:0 26px;cursor:pointer;white-space:nowrap;transition:background .15s}
#go:hover{background:var(--brand-ink)}
#go:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.busy #go{opacity:.7;pointer-events:none}
.msg{min-height:22px;font-size:14px;color:var(--err)}
.fine{font-size:12.5px;color:var(--muted);line-height:1.55;border-top:1px solid var(--hair);padding-top:16px;margin-top:6px}
@media (max-width:820px){#gate{flex-direction:column}.gpane{flex:0 0 34vh}.gmark>*{width:64px}.glogo{margin-bottom:20px}#gate.leaving .gpane{clip-path:inset(0 0 100% 0)}}
@media (prefers-reduced-motion:reduce){.gpane .ph,.gmark-c{animation:none}form.shake{animation:none;outline:1px solid var(--err)}}
#flymark{position:fixed;left:0;top:0;margin:0;z-index:1001;transform-origin:0 0;pointer-events:none;will-change:transform;color:var(--brand)}
#app[hidden]{display:none}
</style>
</head>

    <svg class="glogo" viewBox="-1.587 -1.587 203.912 56.088" aria-label="Accenture" role="img"><path d="m 116.99973,0 v 5.97866 l 11.556,4.516 -11.556,4.296 v 6.15467 l 19.792,-8.016 V 7.97066 Z" fill="currentColor"/><path d="m 185.77066,38.16906 h 8.67999 C 194.316,34.75973 192.76666,33.2984 190.2,33.2984 c -2.03735,0 -3.89601,1.10666 -4.42934,4.87066 m 4.60667,14.744 c -6.68667,0 -11.24667,-3.98533 -11.24667,-11.68933 V 40.7824 c 0,-7.74934 4.82534,-12 11.02267,-12 5.75733,0 10.584,3.23066 10.584,10.892 v 2.79066 h -15.05334 c 0.26666,4.16134 2.03467,5.756 4.82534,5.756 2.47867,0 3.80667,-1.328 4.252,-3.01066 h 5.976 c -0.70667,4.38266 -4.29467,7.70266 -10.36,7.70266 M 163.67466,29.2704 h 6.46399 v 4.24933 c 1.37201,-3.1 3.54268,-4.56 6.952,-4.56 v 6.37467 c -4.38399,0 -6.952,1.328 -6.952,5.18133 v 11.912 h -6.46399 z M 158.98,52.42773 h -6.46667 v -3.41067 c -1.10667,2.21467 -3.276,3.896 -6.732,3.896 -4.16,0 -7.21734,-2.524 -7.21734,-7.968 V 29.2704 h 6.51067 v 14.7 c 0,2.656 1.06133,3.896 3.36534,3.896 2.25732,0 4.07333,-1.41734 4.07333,-4.29467 V 29.2704 H 158.98 Z M 130.19466,22.27306 v 6.99734 h 4.428 v 4.82266 h -4.428 v 10.98267 c 0,1.72933 0.796,2.52533 2.30134,2.52533 0.93065,0 1.63866,-0.13333 2.25866,-0.39733 v 5.04533 c -0.752,0.22267 -2.03733,0.48667 -3.632,0.48667 -5.04534,0 -7.43867,-2.30133 -7.43867,-6.996 V 34.09306 h -2.70133 V 29.2704 h 2.70133 v -4.34134 z m -32.548,6.99734 h 6.464 v 3.45333 c 1.15334,-2.17067 3.45467,-3.94133 6.99734,-3.94133 4.20666,0 6.996,2.524 6.996,8.14666 v 15.49867 h -6.46667 V 37.9024 c 0,-2.7 -1.10533,-3.896 -3.452,-3.896 -2.25868,0 -4.07467,1.37333 -4.07467,4.296 v 14.12533 h -6.464 z m -18.95467,8.89866 h 8.67867 c -0.132,-3.40933 -1.68267,-4.87066 -4.25067,-4.87066 -2.036,0 -3.896,1.10666 -4.428,4.87066 m 4.60667,14.744 c -6.688,0 -11.248,-3.98533 -11.248,-11.68933 V 40.7824 c 0,-7.74934 4.82667,-12 11.02533,-12 5.756,0 10.584,3.23066 10.584,10.892 v 2.79066 h -15.056 c 0.26534,4.16134 2.03734,5.756 4.82534,5.756 2.48,0 3.80933,-1.328 4.252,-3.01066 h 5.97866 c -0.71066,4.38266 -4.296,7.70266 -10.36133,7.70266 m -24.26933,0 c -6.42,0 -11.06934,-3.98533 -11.06934,-11.82266 v -0.308 c 0,-7.83734 4.95867,-12 11.11334,-12 5.26933,0 9.60933,2.65733 10.14133,8.72133 h -6.2 c -0.39867,-2.256 -1.54933,-3.71733 -3.808,-3.71733 -2.74667,0 -4.64933,2.168 -4.64933,6.72933 v 0.708 c 0,4.69467 1.68266,6.82 4.69466,6.82 2.21334,0 3.85067,-1.63867 4.20534,-4.16267 h 5.88933 c -0.44267,5.268 -4.02933,9.032 -10.31733,9.032 m -24.09067,0 c -6.42,0 -11.06933,-3.98533 -11.06933,-11.82266 v -0.308 c 0,-7.83734 4.95866,-12 11.11333,-12 5.26933,0 9.60933,2.65733 10.14133,8.72133 h -6.2 c -0.39866,-2.256 -1.54933,-3.71733 -3.808,-3.71733 -2.74666,0 -4.64933,2.168 -4.64933,6.72933 v 0.708 c 0,4.69467 1.68267,6.82 4.69467,6.82 2.21333,0 3.85066,-1.63867 4.20533,-4.16267 h 5.88933 c -0.44266,5.268 -4.02933,9.032 -10.31733,9.032 m -21.124,-8.19066 v -2.21334 h -2.56933 c -3.18667,0 -4.824,0.88534 -4.824,2.96534 v 0.22133 c 0,1.59467 0.97466,2.70133 3.14266,2.70133 2.21467,0 4.25067,-1.23866 4.25067,-3.67466 M 7.61599,52.91306 C 3.45466,52.91306 0,50.78906 0,46.09306 V 45.8304 c 0,-5.71467 4.95866,-7.57334 10.93733,-7.57334 h 2.87733 v -1.10533 c 0,-2.304 -1.01866,-3.72133 -3.40933,-3.72133 -2.16934,0 -3.32,1.24 -3.49867,3.012 H 0.70799 c 0.44267,-5.136 4.516,-7.66 10.00801,-7.66 5.57866,0 9.56399,2.39066 9.56399,8.14666 V 52.42773 H 13.948 v -2.65867 c -1.10801,1.684 -3.232,3.144 -6.33201,3.144" fill="currentColor"/></svg>

    <h1 id="gt">Credit 360 for ABN AMRO</h1>
    <p>Enter the passcode you received from the Accenture team to open the walkthrough and the deck.</p>
    <form id="f" autocomplete="off">

<script>
const SALT="/UAe7XBT1ulIRn38+tsgfA==", ITER=310000, MANIFEST="vault/46372ccf3c2e0b8c22f825ff.bin";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let KEY=null;
async function derive(pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function openBlob(url,onProgress){
  const res=await fetch(url); if(!res.ok) throw new Error("fetch");
  let buf; const total=+res.headers.get("content-length")||0;
  if(onProgress&&res.body&&total){
    const r=res.body.getReader();const parts=[];let got=0;
    for(;;){const {done,value}=await r.read();if(done)break;parts.push(value);got+=value.length;onProgress(got/total);}
    buf=new Uint8Array(got);let o=0;for(const p of parts){buf.set(p,o);o+=p.length;}
  } else buf=new Uint8Array(await res.arrayBuffer());
  return crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},KEY,buf.slice(12));
}
async function openManifest(pass){
  KEY=await derive(pass);
  const M=JSON.parse(new TextDecoder().decode(await openBlob(MANIFEST)));
  await Promise.all(Object.entries(M.fonts).map(async([fam,b])=>{try{const ff=new FontFace(fam,b64(b).buffer);await ff.load();document.fonts.add(ff);}catch(e){}}));
  return M;
}
const urlCache={};
function fileURL(M,id,type){
  if(urlCache[id]) return urlCache[id];
  const f=M.files.find(x=>x.id===id);
  return urlCache[id]=openBlob("vault/"+f.path).then(p=>URL.createObjectURL(new Blob([p],{type:type||f.type})));
}
function mount(M){const app=document.getElementById("app");app.innerHTML=M.html;app.hidden=false;document.title=M.title;window.scrollTo(0,0);wire(M);}

/* the opening: the mark strikes, the photograph wipes away, the mark flies onto the hero lockup, the name writes in */
async function open(M,animate){
  const root=document.documentElement, gate=document.getElementById("gate");
  if(!animate||RM){mount(M);gate.remove();root.classList.remove("locked");document.querySelectorAll("#hero .pre,#hero .lockup span").forEach(e=>e.classList.add("op-in"));document.querySelector("#hero .chev").style.opacity=1;return;}
  root.classList.add("opening"); mount(M);
  gate.classList.add("striking"); await wait(140);
  const src=document.getElementById("gmark"), dst=document.querySelector("#hero .chev");
  const a=src.getBoundingClientRect(), b=dst.getBoundingClientRect();
  const fly=src.cloneNode(true); fly.id="flymark"; fly.removeAttribute("class");
  Object.assign(fly.style,{width:a.width+"px",height:a.height+"px",transform:`translate(${a.left}px,${a.top}px)`});
  document.body.appendChild(fly);
  gate.classList.add("leaving");
  await wait(260);
  root.classList.remove("locked"); gate.classList.add("gone");
  const s=b.width/a.width;
  await fly.animate([{transform:`translate(${a.left}px,${a.top}px) scale(1)`},{transform:`translate(${b.left}px,${b.top}px) scale(${s})`}],{duration:900,easing:"cubic-bezier(.65,0,.35,1)",fill:"forwards"}).finished;
  dst.style.opacity=1; fly.remove(); gate.remove();
  const q=sel=>document.querySelectorAll("#hero "+sel);
  q(".lockup span").forEach(e=>e.classList.add("op-in"));
  await wait(220); q(".eyebrow").forEach(e=>e.classList.add("op-in"));
  await wait(110); q("h1").forEach(e=>e.classList.add("op-in"));
  await wait(140); q(".sub p").forEach(e=>e.classList.add("op-in"));
  await wait(120); q(".cta").forEach(e=>e.classList.add("op-in"));
  await wait(160); q(".film,.filmbar").forEach(e=>e.classList.add("op-in"));
  root.classList.remove("opening");
}
function fmt(n){return n>=1048576?(n/1048576).toFixed(1)+" MB":Math.round(n/1024)+" KB";}
function wire(M){
  const byId=Object.fromEntries(M.files.map(f=>[f.id,f]));
  document.querySelectorAll("[data-size]").forEach(el=>{const f=byId[el.dataset.size];if(f)el.textContent=fmt(f.size);});
  document.querySelectorAll("[data-dl]").forEach(btn=>btn.addEventListener("click",async()=>{
    const f=byId[btn.dataset.dl]; if(!f||btn.dataset.busy)return;
    btn.dataset.busy="1"; const label=btn.querySelector(".lbl"); const old=label.textContent;
    btn.classList.add("busy"); btn.style.setProperty("--p",0); label.textContent="Preparing 0%";
    try{
      const plain=await openBlob("vault/"+f.path,p=>{p=Math.min(p,1);btn.style.setProperty("--p",p);label.textContent="Preparing "+Math.round(p*100)+"%";});
      btn.classList.remove("busy");
      const url=URL.createObjectURL(new Blob([plain],{type:f.type}));
      const a=document.createElement("a");a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
      label.textContent="Downloaded";setTimeout(()=>{label.textContent=old;},2600);
    }catch(e){btn.classList.remove("busy");label.textContent="Try again";setTimeout(()=>{label.textContent=old;},2600);}
    delete btn.dataset.busy;
  }));
  /* films: poster decrypted on mount, video decrypted ahead of the click once near the screen */
  document.querySelectorAll("#app .film[data-file]").forEach(box=>{
    const f=byId[box.dataset.file], img=box.querySelector("img"), vid=box.querySelector("video"), play=box.querySelector(".play"), t=play.querySelector(".lbl"), old=t.textContent;
    fileURL(M,box.dataset.poster,"image/jpeg").then(u=>{img.src=u;}).catch(()=>{});
    let loading=null, want=false, prog=0;
    const show=()=>{play.style.setProperty("--p",Math.min(prog,1));t.textContent="Loading "+Math.round(Math.min(prog,1)*100)+"%";};
    const load=()=>loading||(loading=openBlob("vault/"+f.path,p=>{prog=p;if(want)show();}).then(plain=>{vid.src=URL.createObjectURL(new Blob([plain],{type:"video/mp4"}));vid.load();return true;}).catch(e=>{loading=null;throw e;}));
    if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();setTimeout(()=>load().catch(()=>{}),box.id==="film"?900:300);}},{rootMargin:"600px"});io.observe(box);}
    const done=()=>{play.classList.remove("busy");play.style.removeProperty("--p");t.textContent=old;};
    const start=()=>{document.querySelectorAll("#app .film video").forEach(v=>{if(v!==vid)v.pause();});done();box.classList.add("on");vid.controls=true;const p=vid.play();if(p&&p.catch)p.catch(()=>{});};
    play.addEventListener("click",async()=>{if(vid.src){start();return;}want=true;play.classList.add("busy");show();try{await load();start();}catch(e){play.classList.remove("busy");t.textContent="Could not load, try again";setTimeout(done,2600);}});
  });
  /* deck viewer */
  const N=M.slides.length, rail=document.getElementById("rail"), sa=document.getElementById("sa"), sb=document.getElementById("sb");
  let cur=0, front=sa;
  M.slides.forEach((s,i)=>{const b=document.createElement("button");b.className="th";b.setAttribute("aria-label","Slide "+(i+1)+": "+s);b.innerHTML=`<img alt=""><span>${String(i+1).padStart(2,"0")}</span>`;b.addEventListener("click",()=>go(i));rail.appendChild(b);});
  const thumbs=[...rail.children];
  const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=thumbs.indexOf(e.target);io2.unobserve(e.target);fileURL(M,"t"+(i+1)).then(u=>{const im=e.target.querySelector("img");im.onload=()=>im.classList.add("ok");im.src=u;}).catch(()=>{});}}),{root:rail,rootMargin:"0px 400px"});
  thumbs.forEach(t=>io2.observe(t));
  async function go(i,scroll){
    cur=(i+N)%N;
    document.getElementById("count").innerHTML=`<b>${String(cur+1).padStart(2,"0")}</b> / ${N}`;
    document.getElementById("ctitle").textContent=M.slides[cur];
    document.getElementById("pbar").style.width=((cur+1)/N*100)+"%";
    thumbs.forEach((t,k)=>t.classList.toggle("cur",k===cur));
    {const t=thumbs[cur];rail.scrollTo({left:t.offsetLeft-rail.clientWidth/2+t.offsetWidth/2,behavior:RM?"auto":"smooth"});}
    if(scroll) document.getElementById("deck").scrollIntoView({behavior:RM?"auto":"smooth"});
    const want=cur; const u=await fileURL(M,"s"+(cur+1)); if(want!==cur) return;
    const back=front===sa?sb:sa; back.onload=()=>{back.classList.add("show");front.classList.remove("show");front=back;}; back.src=u; back.alt=M.slides[cur];
    fileURL(M,"s"+((cur+1)%N+1)).catch(()=>{});
  }
  document.getElementById("prev").addEventListener("click",()=>go(cur-1));
  document.getElementById("next").addEventListener("click",()=>go(cur+1));
  addEventListener("keydown",e=>{const r=document.getElementById("deck").getBoundingClientRect();if(r.top<innerHeight*.6&&r.bottom>innerHeight*.4){if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);}});
  let x0=null; const st=document.getElementById("stage");
  st.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true});
  st.addEventListener("touchend",e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)go(cur+(d<0?1:-1));x0=null;});
  go(0);
  /* questions */
  const qs=document.getElementById("qs");
  M.questions.forEach((q,i)=>{const b=document.createElement("button");b.className="q";b.innerHTML=`<span class="n">${String(i+1).padStart(2,"0")}</span><span><span class="t">${q[0]}</span><span class="a">${q[1]}</span></span><span class="s">Slide ${String(q[2]).padStart(2,"0")}</span>`;b.addEventListener("click",()=>go(q[2]-1,true));qs.appendChild(b);});
  /* nav + reveals */
  const nav=document.getElementById("nav"); if(nav){const s=()=>nav.classList.toggle("solid",scrollY>24);addEventListener("scroll",s,{passive:true});s();}
  const rv=document.querySelectorAll(".rv");
  if("IntersectionObserver" in window&&!RM){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{rootMargin:"0px 0px -8% 0px"});rv.forEach(el=>io.observe(el));}
  else rv.forEach(el=>el.classList.add("in"));
  document.querySelectorAll('#app a[href^="#"]').forEach(a=>a.addEventListener("click",e=>{const el=document.querySelector(a.getAttribute("href"));if(el){e.preventDefault();window.scrollTo({top:el.getBoundingClientRect().top+scrollY-(a.getAttribute("href")==="#hero"?0:72),behavior:RM?"auto":"smooth"});}}));
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const pc=document.getElementById("pc"), msg=document.getElementById("msg"), f=e.target, go=document.getElementById("go");
  msg.textContent=""; f.classList.add("busy"); go.textContent="Opening";
  let M;
  try{M=await openManifest(pc.value.trim());}
  catch(err){msg.textContent="That passcode did not open the materials. Check it and try again.";f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");pc.select();f.classList.remove("busy");go.textContent="Open";return;}
  try{sessionStorage.setItem("c360p",pc.value.trim());}catch(_){}
  await open(M,true);
});
(async()=>{let p=null;try{p=sessionStorage.getItem("c360p");}catch(_){} if(p){try{await open(await openManifest(p),false);}catch(_){}}})();
</script>
